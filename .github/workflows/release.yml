name: Release addon
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/run.py
      - run: python tools/package.py
      - name: Check version tag and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^## Version: //p' Soundstone/Soundstone.toc)
          test "$RELEASE_TAG" = "v$VERSION"
          gh release create "$RELEASE_TAG" "dist/Soundstone-$VERSION.zip" "dist/Soundstone-$VERSION.zip.sha256" --prerelease --title "Soundstone $VERSION" --notes-file docs/RELEASE-NOTES.md
