name: Publish approved release to CurseForge
on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing regular GitHub release tag (vX.Y.Z)'
        required: true
        type: string
      dry_run:
        description: 'Validate without uploading'
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: curseforge-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Acceptance records are added after testing a tag; obtain current tooling/records.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: automation
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]), "Invalid stable tag"'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r release-source/requirements-dev.txt
      - name: Validate and transfer release asset
        env:
          GH_TOKEN: ${{ github.token }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--tag "$RELEASE_TAG" --source "$GITHUB_WORKSPACE/release-source")
          if [ "$DRY_RUN" != "true" ]; then args+=(--upload); fi
          python automation/tools/publish_curseforge.py "${args[@]}"
      - name: Upload receipt or dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-result
          path: automation/dist/curseforge-result.json
